name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm from packageManager, Node from .nvmrc, then a frozen install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Biome
        run: pnpm exec biome ci --reporter=github

      - name: TypeScript
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@v4

      # Builds from the repository directly; nothing is pushed.
      - uses: docker/build-push-action@v7
        with:
          push: false
          build-args: NEXT_PUBLIC_SITE_URL=https://example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
